# Local PostgreSQL for generating migrations and running module integration tests.
services:
  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medusa_voucher
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
